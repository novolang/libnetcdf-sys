[package]
name        = "libnetcdf-sys"
version     = "0.1.1"
description = "Bindings over libnetcdf, the NetCDF-C library: the dataset and its define mode, the dimensions, the variables, the whole-array and slice accessors for doubles, integers and text, the attributes, the netCDF-4 compression settings and the error strings, one declaration per C entry point."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used
# the package yet, and the tests exercise the entry points rather than
# a consumer's use of them.
stability   = "experimental"

# `sys`: the layer for a package that binds one C library and decides
# nothing of its own.  Every `pub fn` in `src/` is an `@ffi`
# declaration of a function in libnetcdf.
layer       = "sys"

category    = "bindings"

# The one C library.  `libnetcdf.so` is what the loader resolves these
# symbols against.  Installing this package does not install it.  A
# netCDF-4 build of it links against libhdf5 in turn, which the loader
# resolves for itself.
wraps       = "libnetcdf"

tags        = ["ffi", "netcdf", "scientific-data", "file-format", "climate", "bindings"]
repository  = "https://github.com/novolang/libnetcdf-sys"
maintainers = ["novo-lang"]
novo        = ">= 0.8.9"

[docs.pages]
"README.md" = "The C entry points of libnetcdf, one novo-lang declaration each"

[dependencies]
# None.  A binding over one C library depends on no novo-lang package.

# The link flag for the `library = "netcdf"` name every declaration in
# `src/` carries.  `libnetcdf-dev` installs
# `/usr/lib/<arch>/pkgconfig/netcdf.pc`, so pkg-config answers
# `-lnetcdf` on Debian and Ubuntu.  Without the block the default is
# `-lnetcdf`, which is the same flag on a system that put the library
# somewhere the linker already looks.
[ffi.netcdf]
pkg_config = "netcdf"
